name: Feature request
description: Something Nunc Sonat should do.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation, not the design.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
    validations:
      required: false
